name: Build Shattered Assist iOS
on:
  push:
    branches: ['主要的']
    paths-ignore: ['packages/**']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: shattered-ios-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Verify actual game assist hooks
        run: |
          python3 tools/verify_external_assets.py
          chmod +x gradlew
          set -o pipefail
          ./gradlew -PiosOnly :core:test :ios:verifyRuntimeApi --no-daemon --console=plain 2>&1 | tee assist-tests.log
      - name: Build native ARM64 iOS app without certificate
        run: |
          set -o pipefail
          xcodebuild -version
          python3 tools/prepare_icons.py
          ./gradlew -PiosOnly -Probovm.archs=arm64 -Probovm.iosSkipSigning=true :ios:createIPA --no-daemon --console=plain --info 2>&1 | tee ios-build.log
      - name: Package for user signing and verify
        run: python3 tools/package_ios.py
      - name: Preserve tests and build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-evidence
          path: |
            assist-tests.log
            ios-build.log
            core/build/reports/tests/test/
            core/build/test-results/test/
            packages/build-info.json
      - name: Preserve IPA
        uses: actions/upload-artifact@v4
        with:
          name: ShatteredAssist-for-ESign
          path: |
            packages/ShatteredAssist.ipa
            packages/ShatteredAssist.ipa.sha256
            packages/ShatteredAssist-source.zip
            packages/ShatteredAssist-source.zip.sha256
      - name: Store download in repository
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add packages ios/assets/Assets.xcassets/AppIcon.appiconset
          git diff --cached --quiet && exit 0
          git commit -m 'Store built Shattered Assist IPA [skip ci]'
          git push
