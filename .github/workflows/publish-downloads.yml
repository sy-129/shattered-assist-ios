name: Publish release and distribution package
on:
  push:
    branches: ['主要的']
    paths: ['.github/workflows/publish-downloads.yml']
  workflow_dispatch:
permissions:
  contents: write
  packages: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify distribution checksums
        working-directory: packages
        run: |
          sha256sum -c ShatteredAssist.ipa.sha256
          sha256sum -c ShatteredAssist-source.zip.sha256
      - name: Publish release downloads
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag=v4.0.2-assist.3
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" --target 8fea1c60a29849c7a02c5fdf9676ff1bc9c03de9 --title 'Shattered Assist 4.0.2-assist.3（924）' --notes-file docs/BUILD_VERIFICATION.md
          fi
          gh release upload "$tag" packages/ShatteredAssist.ipa packages/ShatteredAssist-source.zip packages/ShatteredAssist.ipa.sha256 packages/ShatteredAssist-source.zip.sha256 packages/build-info.json --clobber
      - name: Publish GitHub Packages distribution image
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          mkdir distribution
          cp packages/ShatteredAssist* packages/build-info.json LICENSE.txt distribution/
          cat > distribution/Dockerfile <<'EOF'
          FROM scratch
          LABEL org.opencontainers.image.source="https://github.com/sy-129/shattered-assist-ios"
          LABEL org.opencontainers.image.title="Shattered Assist iOS distribution files"
          LABEL org.opencontainers.image.description="IPA, source ZIP and checksums for download; not a runnable game container. Install the IPA on iOS after signing."
          LABEL org.opencontainers.image.version="4.0.2-assist.3"
          LABEL org.opencontainers.image.licenses="GPL-3.0-or-later"
          COPY . /distribution/
          EOF
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          docker build -t "$image:4.0.2-assist.3" -t "$image:latest" distribution
          docker push "$image:4.0.2-assist.3"
          docker push "$image:latest"
          docker manifest inspect "$image:4.0.2-assist.3" > package-manifest.json
      - uses: actions/upload-artifact@v4
        with:
          name: package-publication-evidence
          path: package-manifest.json
